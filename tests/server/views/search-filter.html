<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advanced Search & Filter - SWP391</title>
  <style>
    :root {
      --primary: #4f46e5;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --border: #e2e8f0;
      --success: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 2rem; }
    .container { max-width: 900px; margin: 0 auto; background: var(--card-bg); border-radius: 0.75rem; border: 1px solid var(--border); padding: 2rem; }
    .search-bar-row { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 1rem; margin-bottom: 1.5rem; }
    @media (max-width: 640px) { .search-bar-row { grid-template-columns: 1fr; } }
    input, select { width: 100%; border: 1px solid var(--border); border-radius: 0.375rem; padding: 0.6rem; font-size: 0.95rem; }
    .result-stats { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; font-size: 0.9rem; color: #64748b; }
    .results-table { width: 100%; border-collapse: collapse; }
    .results-table th, .results-table td { padding: 0.75rem; text-align: left; border-bottom: 1px solid var(--border); }
    .results-table th { background: #f8fafc; font-size: 0.85rem; color: #475569; }
    .status-badge { padding: 0.2rem 0.5rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 600; }
    .status-active { background: #dcfce7; color: #166534; }
    .status-inactive { background: #fee2e2; color: #991b1b; }
    .empty-state { text-align: center; padding: 3rem; color: #94a3b8; }
  </style>
</head>
<body>
  <div class="container">
    <a href="/" style="color: var(--primary); text-decoration: none;">← Quay lại</a>
    <h2 style="margin-top: 0.75rem; margin-bottom: 0.5rem;">🔍 Bộ Lọc & Tìm Kiếm Thành Viên CLB Đa Tiêu Chí</h2>
    <p style="color: #64748b; font-size: 0.95rem; margin-bottom: 1.5rem;">Tìm kiếm tức thì kết hợp theo từ khóa, ban chuyên môn và trạng thái hoạt động</p>

    <div class="search-bar-row">
      <div>
        <input type="text" id="searchInput" placeholder="Tìm theo tên hoặc mã sinh viên (MSSV)..." oninput="debounceFilter()">
      </div>
      <div>
        <select id="deptFilter" onchange="filterData()">
          <option value="ALL">Tất cả các ban</option>
          <option value="Ban Chủ Nhiệm">Ban Chủ Nhiệm</option>
          <option value="Ban Chuyên Môn">Ban Chuyên Môn</option>
          <option value="Ban Truyền Thông">Ban Truyền Thông</option>
          <option value="Ban Hậu Cần">Ban Hậu Cần</option>
        </select>
      </div>
      <div>
        <select id="statusFilter" onchange="filterData()">
          <option value="ALL">Tất cả trạng thái</option>
          <option value="Active">Đang hoạt động (Active)</option>
          <option value="Inactive">Tạm ngưng (Inactive)</option>
        </select>
      </div>
    </div>

    <div class="result-stats">
      <span>Kết quả tìm kiếm: <strong id="resultCount">4</strong> thành viên</span>
    </div>

    <table class="results-table">
      <thead>
        <tr>
          <th>MSSV</th>
          <th>Họ & Tên</th>
          <th>Email</th>
          <th>Vai Trò</th>
          <th>Ban Trực Thuộc</th>
          <th>Trạng Thái</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <!-- Rows populated by JS -->
      </tbody>
    </table>
  </div>

  <script>
    const members = [
      { id: 1, full_name: 'Nguyễn Văn An', student_id: 'SE160001', email: 'an.nv@fpt.edu.vn', role: 'Leader', department: 'Ban Chủ Nhiệm', status: 'Active' },
      { id: 2, full_name: 'Trần Thị Bích', student_id: 'SE160002', email: 'bich.tt@fpt.edu.vn', role: 'Vice Leader', department: 'Ban Chuyên Môn', status: 'Active' },
      { id: 3, full_name: 'Lê Hoàng Cường', student_id: 'SE160003', email: 'cuong.lh@fpt.edu.vn', role: 'Member', department: 'Ban Truyền Thông', status: 'Active' },
      { id: 4, full_name: 'Phạm Thu Dung', student_id: 'SE160004', email: 'dung.pt@fpt.edu.vn', role: 'Member', department: 'Ban Hậu Cần', status: 'Inactive' }
    ];

    let timer = null;
    function debounceFilter() {
      clearTimeout(timer);
      timer = setTimeout(filterData, 200);
    }

    function filterData() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      const dept = document.getElementById('deptFilter').value;
      const status = document.getElementById('statusFilter').value;

      const filtered = members.filter(m => {
        const matchQ = !q || m.full_name.toLowerCase().includes(q) || m.student_id.toLowerCase().includes(q);
        const matchDept = dept === 'ALL' || m.department === dept;
        const matchStatus = status === 'ALL' || m.status === status;
        return matchQ && matchDept && matchStatus;
      });

      document.getElementById('resultCount').textContent = filtered.length;

      const tbody = document.getElementById('tableBody');
      if (filtered.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="empty-state">Không tìm thấy thành viên nào phù hợp với điều kiện lọc.</td></tr>';
        return;
      }

      tbody.innerHTML = filtered.map(m => `
        <tr data-id="${m.id}">
          <td><strong>${m.student_id}</strong></td>
          <td>${m.full_name}</td>
          <td>${m.email}</td>
          <td>${m.role}</td>
          <td>${m.department}</td>
          <td><span class="status-badge ${m.status === 'Active' ? 'status-active' : 'status-inactive'}">${m.status}</span></td>
        </tr>
      `).join('');
    }

    window.onload = filterData;
  </script>
</body>
</html>

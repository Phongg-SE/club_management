<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bulk Email Dispatcher - SWP391</title>
  <style>
    :root {
      --primary: #4f46e5;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --border: #e2e8f0;
      --danger: #ef4444;
      --success: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 2rem; }
    .container { max-width: 750px; margin: 0 auto; background: var(--card-bg); border-radius: 0.75rem; border: 1px solid var(--border); padding: 2rem; }
    .form-group { margin-bottom: 1.25rem; }
    label { display: block; font-weight: 600; font-size: 0.9rem; margin-bottom: 0.4rem; }
    input, select, textarea { width: 100%; border: 1px solid var(--border); border-radius: 0.375rem; padding: 0.6rem; font-size: 0.95rem; }
    textarea { min-height: 140px; resize: vertical; }
    .btn { padding: 0.6rem 1.2rem; background: var(--primary); color: white; border: none; border-radius: 0.375rem; font-weight: 600; cursor: pointer; }
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
    .modal-card { background: white; border-radius: 0.5rem; max-width: 450px; width: 90%; padding: 1.5rem; }
    .alert { padding: 0.75rem 1rem; border-radius: 0.375rem; margin-bottom: 1rem; display: none; }
    .alert-success { background: #dcfce7; color: #166534; }
  </style>
</head>
<body>
  <div class="container">
    <a href="/" style="color: var(--primary); text-decoration: none;">← Quay lại</a>
    <h2 style="margin-top: 0.75rem; margin-bottom: 0.5rem;">📧 Gửi Email Hàng Loạt Cho Thành Viên CLB</h2>
    <p style="color: #64748b; font-size: 0.95rem; margin-bottom: 1.5rem;">Gửi thông báo chính thức qua SMTP email tới tất cả thành viên trong CLB</p>

    <div id="emailAlert" class="alert alert-success"></div>

    <form id="emailForm" onsubmit="openConfirmModal(event)">
      <div class="form-group">
        <label>Chọn Câu Lạc Bộ Nhận Email:</label>
        <select id="targetClub" required>
          <option value="CLUB_IT">CLB Lập Trình & Công Nghệ (48 thành viên)</option>
          <option value="CLUB_ART">CLB Mỹ Thuật & Thiết Kế (32 thành viên)</option>
          <option value="CLUB_MUSIC">CLB Âm Nhạc Giai Điệu Trẻ (55 thành viên)</option>
        </select>
      </div>

      <div class="form-group">
        <label>Mẫu Email Có Sẵn (Template):</label>
        <select id="emailTemplate" onchange="applyTemplate()">
          <option value="">-- Tự soạn thảo nội dung --</option>
          <option value="MEETING">Thông báo họp CLB định kỳ</option>
          <option value="FEE">Nhắc nhở đóng quỹ hoạt động CLB</option>
          <option value="EVENT">Thư mời tham gia sự kiện nội bộ</option>
        </select>
      </div>

      <div class="form-group">
        <label>Tiêu Đề Email (Subject):</label>
        <input type="text" id="emailSubject" placeholder="Nhập tiêu đề email..." required>
      </div>

      <div class="form-group">
        <label>Nội Dung Email (Body):</label>
        <textarea id="emailContent" placeholder="Nội dung gửi tới toàn thể thành viên..." required></textarea>
      </div>

      <button type="submit" id="btnSendMail" class="btn">Gửi email hàng loạt</button>
    </form>
  </div>

  <div id="confirmModal" class="modal">
    <div class="modal-card">
      <h3 style="margin-bottom: 0.75rem;">Xác nhận gửi email</h3>
      <p id="confirmDesc" style="color: #475569; margin-bottom: 1.25rem;">Bạn có chắc chắn muốn gửi email này tới 48 thành viên?</p>
      <div style="display: flex; gap: 0.75rem; justify-content: flex-end;">
        <button class="btn" style="background: #e2e8f0; color: #334155;" onclick="closeModal()">Hủy</button>
        <button class="btn" id="btnConfirmSend" onclick="dispatchEmail()">Xác nhận gửi</button>
      </div>
    </div>
  </div>

  <script>
    const templates = {
      MEETING: {
        subject: '[CLB Thông Báo] Lịch Họp Định Kỳ Tuần Này',
        body: 'Thân gửi toàn thể thành viên,\n\nBan Chủ Nhiệm xin thông báo lịch họp CLB vào lúc 19:00 Chủ Nhật tuần này tại phòng Hội thảo.\nRất mong các bạn có mặt đúng giờ để thảo luận kế hoạch sự kiện sắp tới.\n\nTrân trọng,\nBan Chủ Nhiệm CLB'
      },
      FEE: {
        subject: '[CLB Nhắc Nhở] Đóng Quỹ Hoạt Động Tháng 10/2026',
        body: 'Thân gửi các bạn thành viên,\n\nĐây là email nhắc nhở về việc hoàn thành đóng quỹ CLB tháng 10 (50,000đ/thành viên) trước ngày 15/10 để phục vụ các hoạt động chung.\n\nTrân trọng cảm ơn sự hợp tác của các bạn!'
      },
      EVENT: {
        subject: '[Thư Mời] Tham Gia Hoạt Động Teambuilding Mùa Thu',
        body: 'Thân gửi các bạn,\n\nCLB tổ chức buổi dã ngoại và teambuilding gắn kết vào cuối tuần tới. Mời các bạn đăng ký tham gia cùng đại gia đình CLB!'
      }
    };

    function applyTemplate() {
      const val = document.getElementById('emailTemplate').value;
      if (templates[val]) {
        document.getElementById('emailSubject').value = templates[val].subject;
        document.getElementById('emailContent').value = templates[val].body;
      }
    }

    function openConfirmModal(e) {
      e.preventDefault();
      document.getElementById('confirmModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('confirmModal').style.display = 'none';
    }

    function dispatchEmail() {
      closeModal();
      const alertEl = document.getElementById('emailAlert');
      alertEl.textContent = '✓ Email hàng loạt đã được gửi thành công tới toàn bộ 48 thành viên CLB!';
      alertEl.style.display = 'block';
      document.getElementById('emailForm').reset();
    }
  </script>
</body>
</html>
